name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madeira-ios-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
  # Standard Apple Silicon runners have limited RAM; LLVM compilation is large.
  JOBS: "2"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

defaults:
  run:
    shell: bash

jobs:
  llvm:
    name: Prepare LLVM for iOS
    runs-on: macos-15
    timeout-minutes: 360
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Xcode and CMake
        run: bash scripts/ci/setup-macos.sh llvm

      - name: Identify LLVM cache
        id: cache-key
        env:
          RECIPE_HASH: ${{ hashFiles('scripts/build/build-llvm-ios.sh', 'scripts/ci/setup-macos.sh', '.github/workflows/build-ios.yml') }}
        run: |
          xcode_id="$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)"
          echo "key=llvm-ios-v1-${RUNNER_OS}-${RUNNER_ARCH}-${xcode_id}-${RECIPE_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore LLVM headers and libraries
        id: llvm-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.cache-key.outputs.key }}
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib
            toolchains/llvm-ios-build/.madeira-complete

      - name: Compile LLVM host tools and iOS libraries
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist
          bash scripts/build/build-llvm-ios.sh 2>&1 | tee dist/llvm-build.log

      - name: Save completed LLVM build
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ steps.cache-key.outputs.key }}
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib
            toolchains/llvm-ios-build/.madeira-complete

      - name: Upload LLVM diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: llvm-build-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            dist/llvm-build.log
            toolchains/llvm-*-build/CMakeFiles/CMakeConfigureLog.yaml

  ipa:
    name: Build and package Madeira
    needs: llvm
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Xcode and build dependencies
        run: bash scripts/ci/setup-macos.sh app

      - name: Restore prepared LLVM
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: ${{ needs.llvm.outputs.cache-key }}
          fail-on-cache-miss: true
          path: |
            toolchains/llvm-project/llvm/include
            toolchains/llvm-ios-build/include
            toolchains/llvm-ios-build/lib
            toolchains/llvm-ios-build/.madeira-complete

      - name: Build native dependencies and Debug IPA
        run: |
          mkdir -p dist
          bash scripts/build-ipa.sh 2>&1 | tee dist/madeira-build.log

      - name: Upload IPA for re-signing
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Madeira-IPA
          path: dist/Madeira.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      - name: Summarize build
        run: |
          {
            echo '### Madeira IPA'
            echo "Source commit: $(git rev-parse HEAD)"
            echo 'Download Madeira-IPA from the Artifacts section of this run.'
            echo 'Debug build for iOS 18 or later. Re-sign with your sideloading tool before installing.'
            echo 'The ad-hoc signature does not enable JIT; debugger attachment is still required.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: madeira-build-logs
          retention-days: 7
          if-no-files-found: ignore
          path: |
            dist/madeira-build.log
            build/**/*.err
            build/**/err-*.txt
            build/gnutls-ios/obj/*.log
            wine/build-macos/config.log
            wine/build-arm64ec/config.log
            FEX/build-ios/CMakeFiles/CMakeConfigureLog.yaml
